name: Community OIDC image

on:
  push:
    tags: ['community-v*-oidc.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: corvus-signoz-release
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Verify the dedicated release runner
        run: test "$RUNNER_ENVIRONMENT" = self-hosted
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build and test the sign-in page
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm install --prefix "$RUNNER_TEMP/signoz-node-tools" pnpm@10.32.1
          export PATH="$RUNNER_TEMP/signoz-node-tools/node_modules/.bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm test --runInBand src/pages/Login/__tests__/CommunityLogin.test.tsx src/container/Login/__tests__/Login.test.tsx
          pnpm build
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.11'
          cache: false
      - name: Test and build the Community server
        env:
          CGO_ENABLED: '0'
          SIGNOZ_TEST_POSTGRES_DSN: 'postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable'
          SIGNOZ_SQLSTORE_PROVIDER: postgres
          SIGNOZ_SQLSTORE_POSTGRES_DSN: 'postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable'
        run: |
          go test ./pkg/authn/communityoidc ./pkg/modules/session/implsession ./pkg/tokenizer/opaquetokenizer ./pkg/types/authtypes ./pkg/sqlschema/communitypostgres ./pkg/sqlstore/communitypostgres
          make go-build-community-amd64 OS=linux VERSION="${GITHUB_REF_NAME#community-}" COMMIT_SHORT_SHA="$GITHUB_SHA"
          target/linux-amd64/signoz-community metastore migrate sync up
          target/linux-amd64/signoz-community metastore migrate sync check
      - name: Publish the linux/amd64 image
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/signoz-community:${GITHUB_REF_NAME#community-}"
          docker build --platform linux/amd64 --build-arg TARGETARCH=amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f cmd/community/Dockerfile -t "$image" .
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/signoz-registry.XXXXXX")"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for delay in 0 5 20; do
            sleep "$delay"
            if docker push "$image"; then
              break
            fi
            if [ "$delay" = 20 ]; then exit 1; fi
          done
          docker inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"
